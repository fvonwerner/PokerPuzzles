<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f141c">
  <title>PokerPuzzles</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314202e'/%3E%3Cpath d='M16 6c4 5 9 8 9 12.5A4.5 4.5 0 0 1 17.6 22l1.4 4h-6l1.4-4A4.5 4.5 0 0 1 7 18.5C7 14 12 11 16 6z' fill='%23d9b46a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/lobby" aria-label="PokerPuzzles, all puzzles">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#14202e"/><path d="M16 6c4 5 9 8 9 12.5A4.5 4.5 0 0 1 17.6 22l1.4 4h-6l1.4-4A4.5 4.5 0 0 1 7 18.5C7 14 12 11 16 6z" fill="#d9b46a"/></svg>
      <span>PokerPuzzles</span>
    </a>
    <nav class="mainnav" aria-label="Main">
      <a href="#/" data-nav="play">Play</a>
      <a href="#/lobby" data-nav="lobby"><span class="nav-long">All </span>puzzles</a>
      <a href="#/learn" data-nav="learn">Learn</a>
      <a href="#/battle" data-nav="battle">Battle</a>
    </nav>
    <div class="topbar-right">
      <span class="who" id="who"></span>
      <button class="btn btn-ghost btn-sm icon-btn" id="sound" type="button" aria-pressed="true" title="Sound on" aria-label="Sound effects">
        <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="btn btn-ghost btn-sm" id="logout" type="button">Sign out</button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
